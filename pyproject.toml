[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppyoloe-vehicle-perception"
version = "1.0.0"
description = "CPU-ready intelligent vehicle environment perception with PP-YOLOE+ and OpenVINO"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jiangyou-rhyyy" }]
dependencies = [
  "numpy>=1.24,<3.0",
  "opencv-python>=4.8,<5.0",
  "openvino>=2025.4,<2027.0",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
]

[project.urls]
Repository = "https://github.com/Jiangyou-rhyyy/PP-YOLOE-Intelligent-Vehicle-Perception"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
