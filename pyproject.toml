[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppyoloe-vehicle-perception"
version = "1.0.0"
description = "CPU-ready intelligent vehicle environment perception with PP-YOLOE+ and OpenVINO"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jiangyou-rhyyy" }]
dependencies = [
  "numpy==2.1.3",
  "opencv-python==4.12.0.88",
  "openvino==2024.6.0",
  "Pillow==12.3.0",
  "PyYAML==6.0.3",
]

[project.urls]
Repository = "https://github.com/Jiangyou-rhyyy/PP-YOLOE-Intelligent-Vehicle-Perception"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
